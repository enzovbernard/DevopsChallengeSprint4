<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Agendar Consulta')}" />
  <body>

  <div th:replace="~{fragmentos :: funcao-logout}" />

    <div class="container">
        <div class="row">
            <h1>Agendar Consulta</h1>
        </div>

        <div class="row" th:if="${erro_agendamento != null}">
            <p style="color: red;"><b th:text="${erro_agendamento}"></b></p>
        </div>

        <div class="row">

            <form th:object="${consulta}" th:action="@{/consultas/agendar}" method="post">

            Animal:
            <select class="form-select" name="id_animal">
            	<option th:each="animal : ${lista_animais}" th:value="${animal.id_animal}"
            	 th:text="${animal.nm_animal}"></option>
            </select><br>

            Veterinário:
            <select class="form-select" name="id_veterinario">
            	<option th:each="veterinario : ${lista_veterinarios}" th:value="${veterinario.id_veterinario}"
            	 th:text="${veterinario.nm_veterinario}"></option>
            </select><br>

            Data da Consulta: <input class="form-control" type="date" th:field="*{dt_consulta}"
            th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{dt_consulta}"></div><br>

            <h3>Próximas consultas já agendadas</h3>
            <p th:if="${#lists.isEmpty(consultas_agendadas)}">Nenhuma consulta agendada.</p>
            <table class="table table-hover" th:unless="${#lists.isEmpty(consultas_agendadas)}">
                <thead>
                    <tr>
                        <th scope="col">Data</th>
                        <th scope="col">Veterinário</th>
                        <th scope="col">Animal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="agendada : ${consultas_agendadas}">
                        <td th:text="${#temporals.format(agendada.dt_consulta,'dd/MM/yyyy')}"></td>
                        <td th:text="${agendada.veterinario != null ? agendada.veterinario.nm_veterinario : '-'}"></td>
                        <td th:text="${agendada.animal != null ? agendada.animal.nm_animal : '-'}"></td>
                    </tr>
                </tbody>
            </table>

            <input type="hidden" name="_csrf" th:value="${_csrf.token}">

            <button type="submit">Agendar</button>

            </form>

        </div>

        <div class="row">
            <a href="/consultas">Voltar</a>
        </div>
    </div>

<script th:replace="~{fragmentos :: bootstrap-script}" />

</body>
</html>
