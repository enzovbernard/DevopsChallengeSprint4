<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Detalhes do Responsável')}" />
  <body>

  <div th:replace="~{fragmentos :: funcao-logout}" />

    <div class="container">
        <div class="row">
            <h1>Detalhes do Responsável</h1>
        </div>
        <div class="row">
            <div class="col-12">
                <table class="table table-hover">

                <tr>
	                <td><b>Nome:</b></td>
	                <td th:text="${responsavel.nm_responsavel}"></td>
                </tr>

                <tr>
	                <td><b>CPF:</b></td>
	                <td th:text="${responsavel.cpf}"></td>
                </tr>

                <tr>
	                <td><b>E-mail:</b></td>
	                <td th:text="${responsavel.email}"></td>
                </tr>

                <tr>
	                <td><b>Telefone:</b></td>
	                <td th:text="${responsavel.num_celular}"></td>
                </tr>

                <tr>
	                <td><b>Data de Nascimento:</b></td>
	                <td th:text="${#temporals.format(responsavel.dt_nascimento,'dd/MM/yyyy')}"></td>
                </tr>

                </table>
            </div>
        </div>
        <div class="row">
            <a href="/responsaveis">Voltar</a>
        </div>
    </div>

  <script th:replace="~{fragmentos :: bootstrap-script}" />

   </body>
</html>
